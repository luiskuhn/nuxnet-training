name: Test Python and container environments

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-code repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt pytest==8.3.3
          python -m pip check

      - name: Run tests
        run: pytest -q

      - name: Build Docker container
        run: docker build --tag numorph-nuclei-segmentation:test .

      - name: Smoke test Docker entry point and dependencies
        run: |
          docker run --rm numorph-nuclei-segmentation:test python -c \
            "import mlflow, numpy, pytorch_lightning, tifffile, torch"
          docker run --rm numorph-nuclei-segmentation:test --help
